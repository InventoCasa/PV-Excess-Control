name: Remove obsolete validation run

on:
  push:
    branches: [release/0.4.0rc1]

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    if: github.repository == 'InventoCasa/PV-Excess-Control'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Remove the completed run for the deleted branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          if repository != 'InventoCasa/PV-Excess-Control':
              raise SystemExit('Unexpected repository')
          base = 'https://api.github.com/repos/' + repository
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json'}
          def request(path, method='GET'):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return None
                  raise SystemExit('Maintenance API request failed: HTTP ' + str(error.code)) from None
          path = '/actions/runs/34335945555'
          run = request(path)
          if run is None:
              print('Obsolete run is already absent')
              raise SystemExit(0)
          if run.get('name') != 'Public CI' or run.get('status') != 'completed' or run.get('event') != 'push':
              raise SystemExit('Unexpected run metadata; nothing removed')
          branch = urllib.parse.quote(run['head_branch'], safe='')
          if request('/git/ref/heads/' + branch) is not None:
              raise SystemExit('Original branch still exists; nothing removed')
          request(path, method='DELETE')
          if request(path) is not None:
              raise SystemExit('Run removal was not confirmed')
          print('Obsolete validation run removed')
          PY
